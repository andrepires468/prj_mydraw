        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
        }

<body class="bg-surface min-h-screen flex items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Background Decorative Elements -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-surface-container-high rounded-full blur-[120px] opacity-40"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-container/20 rounded-full blur-[100px] opacity-30"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[440px]">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center mb-12">
<div class="w-16 h-16 bg-gradient-to-br from-primary to-primary-container rounded-full flex items-center justify-center shadow-[0_8px_32px_rgba(74,75,215,0.15)] mb-6">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tighter text-on-surface mb-2">mydrow.app</h1>
<p class="text-on-surface-variant font-medium tracking-tight text-sm">Administrative Gateway</p>
</div>
<!-- Login Card -->
<div class="surface-container-lowest glass-panel rounded-3xl p-8 md:p-10 shadow-[0_32px_64px_-16px_rgba(5,52,92,0.08)]">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-[0.1em] font-bold text-on-surface-variant ml-1" for="email">
                        Email Address
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="mail">mail</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container/30 focus:bg-surface-container-high input-transition text-sm" id="email" name="email" placeholder="admin@mydrow.app" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-[10px] uppercase tracking-[0.1em] font-bold text-on-surface-variant" for="password">
                            Password
                        </label>
<a class="text-[10px] uppercase tracking-[0.1em] font-bold text-primary hover:text-primary-dim transition-colors" href="#">
                            Forgot?
                        </a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-2xl py-4 pl-12 pr-12 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container/30 focus:bg-surface-container-high input-transition text-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-full font-semibold tracking-tight shadow-[0_12px_24px_-8px_rgba(74,75,215,0.4)] hover:shadow-[0_16px_32px_-8px_rgba(74,75,215,0.5)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group" type="submit">
<span>Authorize Session</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Security Footer -->
<div class="flex items-center justify-center gap-4 pt-4">
<div class="flex items-center gap-1.5 opacity-60">
<span class="material-symbols-outlined text-sm" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="text-[10px] uppercase tracking-[0.05em] font-medium text-on-surface">256-bit AES</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant/30"></div>
<div class="flex items-center gap-1.5 opacity-60">
<span class="material-symbols-outlined text-sm" data-icon="fingerprint">fingerprint</span>
<span class="text-[10px] uppercase tracking-[0.05em] font-medium text-on-surface">Biometrics Ready</span>
</div>
</div>
</form>
</div>
<!-- System Footer -->
<div class="mt-12 text-center">
<p class="text-[11px] text-on-surface-variant font-medium tracking-wide">
                SYSTEM ID: DROW-ADMIN-001 • <span class="text-primary cursor-pointer hover:underline">NODE STATUS: ONLINE</span>
</p>
</div>
</main>
