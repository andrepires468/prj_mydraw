<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(11, 12, 14, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

            box-shadow: 0 0 20px -5px rgba(99, 102, 241, 0.3);
        }

<body class="bg-background min-h-screen flex items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container overflow-hidden text-on-surface">
<!-- Background Decorative Elements -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-primary/10 rounded-full blur-[140px] opacity-40"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-tertiary/10 rounded-full blur-[140px] opacity-30"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[440px]">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center mb-12">
<div class="w-16 h-16 bg-gradient-to-br from-primary to-primary-container rounded-2xl flex items-center justify-center shadow-[0_8px_32px_rgba(99,102,241,0.2)] mb-6 glow-effect">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tighter text-on-surface mb-2">mydrow.app</h1>
<p class="text-on-surface-variant font-medium tracking-tight text-sm uppercase letter-spacing-[0.1em]">Administrative Gateway</p>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-[2.5rem] p-8 md:p-10 shadow-[0_32px_64px_-16px_rgba(0,0,0,0.5)]">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-on-surface-variant/80 ml-1" for="email">
                        Email Address
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="mail">mail</span>
</div>
<input class="w-full bg-surface-container-low border border-outline/10 rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-surface-container-high input-transition text-sm" id="email" name="email" placeholder="admin@mydrow.app" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-on-surface-variant/80" for="password">
                            Password
                        </label>
<a class="text-[10px] uppercase tracking-[0.1em] font-bold text-primary hover:text-primary-fixed-dim transition-colors" href="#">
                            Forgot?
                        </a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-low border border-outline/10 rounded-2xl py-4 pl-12 pr-12 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 focus:border-primary/40 focus:bg-surface-container-high input-transition text-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-full font-semibold tracking-tight shadow-[0_12px_24px_-8px_rgba(99,102,241,0.5)] hover:shadow-[0_16px_32px_-8px_rgba(99,102,241,0.6)] hover:brightness-110 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group glow-effect" type="submit">
<span>Authorize Session</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Security Footer -->
<div class="flex items-center justify-center gap-4 pt-4">
<div class="flex items-center gap-1.5 opacity-50 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm text-primary" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="text-[10px] uppercase tracking-[0.05em] font-medium text-on-surface">256-bit AES</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant/30"></div>
<div class="flex items-center gap-1.5 opacity-50 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm text-primary" data-icon="fingerprint">fingerprint</span>
<span class="text-[10px] uppercase tracking-[0.05em] font-medium text-on-surface">Biometrics Ready</span>
</div>
</div>
</form>
</div>
<!-- System Footer -->
<div class="mt-12 text-center">
<p class="text-[11px] text-on-surface-variant font-medium tracking-widest uppercase">
                SYSTEM ID: <span class="text-on-surface">DROW-ADMIN-001</span> • <span class="text-primary cursor-pointer hover:underline">NODE STATUS: ONLINE</span>
</p>
</div>
</main>
