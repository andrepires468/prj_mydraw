name: ${COMPOSE_PROJECT_NAME:-mydraw}

services:
  # ============================================================================
  # API — Lumen 10 (PHP 8.2 FPM)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: mydraw_api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/mydraw_api:/var/www/html
      - ./docker/api/php.ini:/usr/local/etc/php/conf.d/zz-mydraw.ini:ro
    environment:
      APP_ENV: ${API_APP_ENV:-local}
      APP_DEBUG: ${API_APP_DEBUG:-true}
      APP_KEY: ${API_APP_KEY}
      APP_URL: ${API_APP_URL:-http://localhost:8080}
      JWT_SECRET: ${API_JWT_SECRET}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FILESYSTEM_DRIVER: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      AWS_BUCKET: ${MINIO_BUCKET}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MINIO_PUBLIC_URL: ${APP_VITE_MINIO_PUBLIC_URL:-http://localhost:9000}
      PHP_IDE_CONFIG: "serverName=mydraw_api"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mydraw

  # ============================================================================
  # Nginx — reverse proxy para a API Lumen
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: mydraw_nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./apps/mydraw_api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - mydraw

  # ============================================================================
  # APP — Vue 3 + Vite (hot reload)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: mydraw_app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes:
      - ./apps/mydraw_app:/app
      - mydraw_app_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${APP_VITE_API_URL:-http://localhost:8080}
      VITE_MINIO_PUBLIC_URL: ${APP_VITE_MINIO_PUBLIC_URL:-http://localhost:9000}
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev -- --host 0.0.0.0 --port 5173; else echo 'mydraw_app vazio — rode make init primeiro' && sleep infinity; fi"
    networks:
      - mydraw

  # ============================================================================
  # MinIO — object storage (S3-compatível)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: mydraw_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    volumes:
      - mydraw_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mydraw

  # ============================================================================
  # createbuckets — cria o bucket padrão no MinIO e define policy pública de
  # leitura. Roda uma única vez e encerra.
  # ============================================================================
  createbuckets:
    image: minio/mc:latest
    container_name: mydraw_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET} &&
      echo 'Bucket ${MINIO_BUCKET} pronto.'
      "
    networks:
      - mydraw

volumes:
  mydraw_minio_data:
  mydraw_app_node_modules:

networks:
  mydraw:
    driver: bridge
