name: ${COMPOSE_PROJECT_NAME:-mydraw}

services:
  # ============================================================================
  # API — Lumen 10 (PHP 8.2 FPM)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: mydraw_api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/mydraw_api:/var/www/html
      - ./docker/api/php.ini:/usr/local/etc/php/conf.d/zz-mydraw.ini:ro
      - ./docker/api/zz-fpm-mydraw.conf:/usr/local/etc/php-fpm.d/zz-mydraw.conf:ro
    environment:
      APP_ENV: ${API_APP_ENV:-local}
      APP_DEBUG: ${API_APP_DEBUG:-true}
      APP_KEY: ${API_APP_KEY}
      APP_URL: ${API_APP_URL:-http://localhost:8080}
      JWT_SECRET: ${API_JWT_SECRET}
      JWT_TTL: ${API_JWT_TTL:-129600}
      JWT_REFRESH_TTL: ${API_JWT_REFRESH_TTL:-129600}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FILESYSTEM_DRIVER: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      AWS_BUCKET: ${MINIO_BUCKET}
      # Endpoint S3 para o PHP **dentro** da rede Docker (hostname do serviço `minio`).
      # No `.env` raiz deixe `MINIO_API_URL` vazio para MinIO local, ou defina o HTTPS do MinIO remoto.
      AWS_ENDPOINT: ${MINIO_API_URL:-http://minio:9000}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_VERIFY_SSL: ${AWS_VERIFY_SSL:-true}
      MINIO_PUBLIC_URL: ${APP_VITE_MINIO_PUBLIC_URL:-http://localhost:9100}
      MINIO_PUBLIC_LAN_URL: ${MINIO_PUBLIC_LAN_URL:-}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      POSTS_LIST_CACHE_TTL_SECONDS: ${POSTS_LIST_CACHE_TTL_SECONDS:-15}
      CIVITAI_API_TOKEN: ${CIVITAI_API_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_429_MAX_ATTEMPTS: ${GEMINI_429_MAX_ATTEMPTS:-5}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-240}
      GEMINI_CATEGORIZE_IMAGE_TIMEOUT_SECONDS: ${GEMINI_CATEGORIZE_IMAGE_TIMEOUT_SECONDS:-60}
      GEMINI_REQUEST_SLEEP_SECONDS: ${GEMINI_REQUEST_SLEEP_SECONDS:-4}
      AI_CATEGORIZATION_ENABLED: ${AI_CATEGORIZATION_ENABLED:-true}
      OLLAMA_PREFER: ${OLLAMA_PREFER:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-240}
      OLLAMA_REQUEST_SLEEP_SECONDS: ${OLLAMA_REQUEST_SLEEP_SECONDS:-0}
      PHP_IDE_CONFIG: "serverName=mydraw_api"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mydraw

  # ============================================================================
  # MySQL 8 — banco local (profile `local-db`)
  # ----------------------------------------------------------------------------
  # Sobe quando `COMPOSE_PROFILES` inclui `local-db`
  # (ver `.env.example`). A API usa `DB_HOST=mysql` na rede Docker; no host,
  # DataGrip e ferramentas locais: `localhost:${MYSQL_PORT:-33306}`.
  # ============================================================================
  mysql:
    # Tag 8.0: PDO/php-mysql estável (evitar 8.4 no dev até alinhar auth do cliente PHP).
    image: mysql:8.0
    container_name: mydraw_mysql
    restart: unless-stopped
    profiles: ["local-db"]
    ports:
      - "${MYSQL_PORT:-33306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mydraw_root}
      MYSQL_DATABASE: ${DB_DATABASE:-mydraw}
      MYSQL_USER: ${DB_USERNAME:-mydraw}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mydraw}
    volumes:
      - mydraw_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - mydraw

  # ============================================================================
  # Nginx — reverse proxy para a API Lumen
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: mydraw_nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./apps/mydraw_api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - mydraw

  # ============================================================================
  # APP — Vue 3 + Vite (hot reload)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: mydraw_app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes:
      - ./apps/mydraw_app:/app
      - mydraw_app_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${APP_VITE_API_URL:-http://localhost:8080}
      VITE_API_VERSION: ${APP_VITE_API_VERSION:-v1}
      VITE_MINIO_PUBLIC_URL: ${APP_VITE_MINIO_PUBLIC_URL:-http://localhost:9100}
      VITE_GOOGLE_CLIENT_ID: ${APP_VITE_GOOGLE_CLIENT_ID:-}
    command: sh -c "if [ -f package.json ]; then npm install && (node warmup-vite.mjs &) && npm run dev -- --host 0.0.0.0 --port 5173; else echo 'mydraw_app vazio — rode bash scripts/init.sh antes' && sleep infinity; fi"
    networks:
      - mydraw

  # ============================================================================
  # MinIO — object storage (S3-compatível) — OPCIONAL
  # ----------------------------------------------------------------------------
  # Só sobe quando o profile `local-storage` é ativado. Em produção/staging a
  # API aponta para um MinIO externo via `MINIO_API_URL` no `.env` raiz.
  #
  # Para subir o MinIO local: docker compose --profile local-storage up -d --build
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: mydraw_minio
    restart: unless-stopped
    profiles: ["local-storage"]
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    volumes:
      - mydraw_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mydraw

  # ============================================================================
  # createbuckets — cria o bucket padrão no MinIO local e define policy pública
  # de leitura. Também só sobe sob o profile `local-storage`.
  # ============================================================================
  createbuckets:
    image: minio/mc:latest
    container_name: mydraw_createbuckets
    profiles: ["local-storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET} &&
      echo 'Bucket ${MINIO_BUCKET} pronto.'
      "
    networks:
      - mydraw

volumes:
  mydraw_mysql_data:
  mydraw_minio_data:
  mydraw_app_node_modules:

networks:
  mydraw:
    driver: bridge
